<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine 💙💜</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#b8e7ff;
  --purple:#e3c6ff;
}

*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Poppins,sans-serif;

  /* 🔽 PUT YOUR BACKGROUND IMAGE HERE */
  background-image:url("BG.png");
  background-size:cover;
  background-position:center;
}

/* soft blur overlay */
body::before{
  content:"";
  position:fixed;
  inset:0;
  backdrop-filter:blur(9px);
  background:rgba(180,220,255,.25);
}

.container{
  position:relative;
  z-index:2;
  background:rgba(255,255,255,.35);
  backdrop-filter:blur(75px);
  padding:40px 25px;
  border-radius:25px;
  width:420px;
  max-width:90%;
  text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.25);
}

h1{
  font-family:Pacifico,cursive;
  font-size:3.0rem;
  margin-bottom:25px;
  background:linear-gradient(124deg,var(--blue),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

#gif{
  display:none;
  width:100%;
  max-height:300px;
  margin:15px 0;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

button{
  border:none;
  padding:12px 30px;
  border-radius:30px;
  font-size:1rem;
  cursor:pointer;
  transition:.3s;
}

#yesBtn{
  background:linear-gradient(90deg,var(--blue),var(--purple));
  font-weight:600;
}

#noBtn{
  background:white;
}

/* 💙💜 Heart shower */
.heart{
  position:fixed;
  top:-30px;
  font-size:28px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{transform:translateY(110vh);opacity:0}
}

/* 💌 Love letter envelope */
.envelope{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(120deg,var(--blue),var(--purple));
  animation:fadeIn 1s forwards;
  z-index:5;
}

.mail{
  width:260px;
  height:180px;
  background:white;
  border-radius:10px;
  position:relative;
  overflow:hidden;
}

.flap{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  clip-path:polygon(0 0,100% 0,50% 60%);
  animation:openFlap 1.5s forwards;
}

.letter{
  position:absolute;
  bottom:-100%;
  width:100%;
  height:100%;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Pacifico,cursive;
  font-size:2.2rem;
  color:#6b4eff;
  animation:letterUp 2s 1s forwards;
}

@keyframes openFlap{
  to{transform:rotateX(180deg);opacity:0}
}

@keyframes letterUp{
  to{bottom:0}
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="Until I Found You (Em Beihold Version).mp3" type="audio/mpeg">
</audio>

<div class="container">
  <h1>Will you be my Valentine my Bebi Wifey? 😁👉👈💙💜</h1>
  <img id="gif" src="Yes.gif">

  <div class="buttons">
    <button id="yesBtn">Yes 💙</button>
    <button id="noBtn">No sorry 😢</button>
  </div>
</div>

<script>
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const gif=document.getElementById("gif");
const music=document.getElementById("bgMusic");

let clicks=0;

const noGifs=["NO1.gif","NO2.gif","NO3.gif","NO5.gif"];

document.body.addEventListener("click",()=>music.play(),{once:true});

function heartShower(){
  for(let i=0;i<45;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML=Math.random()>.5?"💙":"💜";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(2+Math.random()*2)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),4000);
  }
}

yesBtn.onclick=()=>{
  gif.style.display="block";
  gif.src="Yes.gif";
  heartShower();

  setTimeout(()=>{
    const env=document.createElement("div");
    env.className="envelope";
    env.innerHTML=`
      <div class="mail">
        <div class="flap"></div>
        <div class="letter"> I love you!! 😍😘💙💜</div>
      </div>`;
    document.body.appendChild(env);
    heartShower();
  },1200);
};

noBtn.onclick=()=>{
  clicks++;
  gif.style.display="block";
  gif.src=noGifs[clicks-1]||noGifs[4];
  yesBtn.style.transform=`scale(${1+clicks*.25})`;

  if(clicks===5){
    noBtn.style.position="fixed";
    setInterval(()=>{
      noBtn.style.left=Math.random()*80+"%";
      noBtn.style.top=Math.random()*80+"%";
    },400);
  }
};
</script>

</body>
</html>
