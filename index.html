<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine 💙💜</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#b8e7ff;
  --purple:#e3c6ff;
}

*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Poppins,sans-serif;

  /* 🔽 PUT YOUR BACKGROUND IMAGE HERE */
  background-image:url("BG.png");
  background-size:cover;
  background-position:center;
}

/* soft blur overlay */
body::before{
  content:"";
  position:fixed;
  inset:0;
  backdrop-filter:blur(9px);
  background:rgba(180,220,255,.25);
}

.container{
  position:relative;
  z-index:2;
  background:rgba(255,255,255,.35);
  backdrop-filter:blur(75px);
  padding:40px 25px;
  border-radius:25px;
  width:420px;
  max-width:90%;
  text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.25);
}

h1 {
  font-family: Pacifico, cursive;
  font-size: 2.2rem;
  margin-bottom: 25px;
  animation: float 3s ease-in-out infinite;
  /* This shadow creates a "border" so the light colors stand out */
  text-shadow: 2px 2px 10px rgba(107, 78, 255, 0.3); 
  line-height: 1.4;
}

.gradient-text {
  /* Using slightly deeper shades of your blue and purple for readability */
  background: linear-gradient(124deg, #4ea8ff, #9d50bb);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline;
  font-weight: bold;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

#gif{
  display:none;
  width:100%;
  max-height:300px;
  margin:15px 0;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

button{
  border:none;
  padding:12px 30px;
  border-radius:30px;
  font-size:1rem;
  cursor:pointer;
  transition:.3s;
}

#yesBtn{
  background:linear-gradient(90deg,var(--blue),var(--purple));
  font-weight:600;
}

#noBtn{
  background:white;
}

/* 💙💜 Heart shower */
.heart {
  position: fixed;
  top: -30px;
  /* Higher z-index than the envelope (which is 10) */
  z-index: 20; 
  font-size: 28px;
  animation: fall linear forwards;
  pointer-events: none; /* So you can still click things through the shower */
}

@keyframes fall{
  to{transform:translateY(110vh);opacity:0}
}

/* Container for the whole envelope */
.envelope {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.4);
  z-index: 10;
  animation: fadeIn 0.5s forwards;
}

.mail {
  width: 320px;
  height: 220px;
  background: #fff;
  border-radius: 5px;
  position: relative;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  overflow: hidden; /* This keeps the letter hidden inside */
}

/* The flap that opens first */
.flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 50%; /* Just the top half */
  background: #f2f2f2;
  border: 1px solid #ddd;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  z-index: 3;
  transition: transform 0.8s ease-in;
  transform-origin: top;
}

/* The actual paper inside */
.letter {
  position: absolute;
  bottom: -100%; /* Start completely hidden below the envelope */
  left: 5%;
  width: 90%;
  height: 85%;
  background: #fff;
  border: 1px solid #eee;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Pacifico, cursive;
  font-size: 1.8rem;
  color: #6b4eff;
  z-index: 2;
  /* Wait for flap (0.8s) before starting to move up */
  transition: bottom 1s ease-out 0.8s; 
  box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
}

/* Triggered classes */
.envelope.open .flap {
  transform: rotateX(180deg);
}

.envelope.open .letter {
  bottom: 10%; /* Slide up into view */
}

@keyframes openFlap{
  to{transform:rotateX(180deg);opacity:0}
}

@keyframes letterUp{
  to{bottom:0}
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="Until I Found You (Em Beihold Version).mp3" type="audio/mpeg">
</audio>

<div class="container">
  <h1>
    <span class="gradient-text">Will you be my Valentine my Bebi Wifey?</span> 
    <br> 😁👉👈💙💜
  </h1>
  <img id="gif" src="Yes.gif">

  <div class="buttons">
    <button id="yesBtn">Yes 💙</button>
    <button id="noBtn">No sorry 😢</button>
  </div>
</div>

<script>
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const gif=document.getElementById("gif");
const music=document.getElementById("bgMusic");

let clicks=0;

const noGifs=["NO1.gif","NO2.gif","NO3.gif ","NO4.gif","NO5.gif"];

document.body.addEventListener("click",()=>music.play(),{once:true});

function heartShower(amount = 45) {
  const icons = ["💙", "💜", "🌸", "🌹", "✨"];
  for (let i = 0; i < amount; i++) {
    createIcon(icons);
  }
}

function createIcon(icons) {
  const h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = icons[Math.floor(Math.random() * icons.length)];
  h.style.left = Math.random() * 100 + "vw";
  // Random speeds for a natural feel
  h.style.animationDuration = (2 + Math.random() * 3) + "s";
  h.style.fontSize = (15 + Math.random() * 25) + "px";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 5000);
}

yesBtn.onclick = () => {
  gif.style.display = "block";
  gif.src = "Yes.gif";
  
  heartShower(60);

  const continuousShower = setInterval(() => {
    createIcon(["💙", "💜", "🌸", "🌹", "✨"]);
  }, 300);

  setTimeout(() => {
    const env = document.createElement("div");
    env.className = "envelope"; 
    env.innerHTML = `
      <div class="mail">
        <div class="flap"></div>
        <div class="letter"> Yey!! I love you my Bebi Wifey!! 💙💜</div>
      </div>`;
    document.body.appendChild(env);
    
    // Start the animation sequence
    setTimeout(() => env.classList.add("open"), 100);
  }, 3500); 
};


noBtn.onclick=()=>{
  clicks++;
  gif.style.display="block";
  gif.src=noGifs[clicks-1]||noGifs[4];
  yesBtn.style.transform=`scale(${1+clicks*.25})`;

  if(clicks===5){
    noBtn.style.position="fixed";
    setInterval(()=>{
      noBtn.style.left=Math.random()*80+"%";
      noBtn.style.top=Math.random()*80+"%";
    },400);
  }
};
</script>

</body>
</html>
